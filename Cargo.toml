[package]
name = "waybar-tapo"
version = "0.1.0"
edition = "2024"
description = "Small Rust status and control helper for a Tapo L900 Waybar module"
license = "MIT"
repository = "https://github.com/BahadirAydin/waybar-tapo"

[dependencies]
tapo = { version = "=0.9.0", features = ["debug"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[profile.release]
strip = true
lto = "thin"
